name: Build ZEECROWN STORE Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-build:
    name: Build & Verify Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install website dependencies
        run: npm --prefix web ci

      - name: Type-check and build production website
        run: |
          npm --prefix web run lint
          npm --prefix web run build

      - name: Verify production website build output
        run: |
          test -s web/dist/index.html
          test -d web/dist/assets
          ls -lh web/dist/index.html

  backend-checks:
    name: Cloud Functions Lint, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Run Cloud Functions lint, build, and tests
        run: |
          npm --prefix functions run lint
          npm --prefix functions run build
          node --test functions/test/*.test.js

  android-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (required by AGP 9.1.1 / Gradle 9.3.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and accept Android SDK licenses
        run: |
          set -euo pipefail
          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from committed debug.keystore.base64..."
            rm -f debug.keystore
            if ! tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore; then
              echo "Warning: Failed to decode debug.keystore.base64; falling back to temporary debug keystore."
              rm -f debug.keystore
            fi
          fi
          if [ -s debug.keystore ]; then
            if ! keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
              echo "Warning: Existing debug.keystore is invalid or missing alias androiddebugkey; regenerating temporary debug keystore."
              rm -f debug.keystore
            fi
          fi
          if [ ! -s debug.keystore ]; then
            echo "Generating temporary standard Android debug keystore via keytool..."
            rm -f debug.keystore
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey > /dev/null
          echo "Verified debug.keystore (alias androiddebugkey) for debugConfig."
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Build Android Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Android Debug APK and Firebase resource generation
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: Expected APK not found or empty at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"
          if [ ! -s app/google-services.json ]; then
            echo "::warning::app/google-services.json is missing from the repository; Google Services resources (default_web_client_id) were not bundled."
          else
            GENERATED_GS_VALUES="app/build/generated/res/processDebugGoogleServices/values/values.xml"
            if [ -s "$GENERATED_GS_VALUES" ] && grep -q 'name="default_web_client_id"' "$GENERATED_GS_VALUES"; then
              echo "Verified generated default_web_client_id in $GENERATED_GS_VALUES"
            else
              echo "::warning::default_web_client_id was not generated in $GENERATED_GS_VALUES; verify app/google-services.json matches applicationId and includes an OAuth web client (client_type 3)."
            fi
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeecrown-store-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

# Security & crawl hygiene headers for public web assets
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=300"

# Canonical plural -> singular redirects
[[redirects]]
  from = "/products/*"
  to = "/product/:splat"
  status = 301

[[redirects]]
  from = "/categories/*"
  to = "/category/:splat"
  status = 301

[[redirects]]
  from = "/collections/*"
  to = "/collection/:splat"
  status = 301

# React SPA fallback so direct route visits & refreshes load the full store app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/products/*"
  to = "/product/:splat"
  status = 301

[[redirects]]
  from = "/categories/*"
  to = "/category/:splat"
  status = 301

[[redirects]]
  from = "/collections/*"
  to = "/collection/:splat"
  status = 301

# Serve dedicated non-indexed 404 page instead of soft-404 home fallback
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
